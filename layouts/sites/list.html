{{ define "main" -}}

<div><a class="td-anchor-no-extra-offset"></a></div>
<section
  class="row td-box td-box--primary position-relative td-box--height-auto td-below-navbar"
>
  <div class="col-12">
    <div class="container text-center td-arrow-down">
      <span class="h4 mb-0">
        <h1>{{ T "community_join" . }}</h1>
      </span>
    </div>
  </div>
</section>

<section class="row td-box td-box--white td-box--height-auto linkbox">
  {{ with .Content -}}
  <div class="td-content">
    {{ . }}
  </div>
  {{- end -}}
</section>

{{ end }}
