<a href="{{ .Destination | safeURL }}"
  {{ with .Title }} title="{{ . }}"{{ end }}
  {{ if strings.HasPrefix .Destination "http" }} target="_blank" rel="noopener"{{ end }}>
  {{- .Text | safeHTML -}}
</a>
{{ if and (strings.HasPrefix .Destination "http") (not (strings.Contains .Destination "wowhead")) }}<i class="fa fa-external-link" style="font-size: 16px" aria-hidden="true"></i>{{ end }}
